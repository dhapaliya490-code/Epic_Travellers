<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a new Epic-Travellers account to explore luxury tour packages and personalized travel planning across India.">
  <title>Create Account – Epic-Travellers | Discover Incredible India</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../Content/css/style.css">
  <link rel="stylesheet" href="../Content/css/components.css">
  <link rel="stylesheet" href="../Content/css/animations.css">
  <link rel="stylesheet" href="../Content/css/dark-mode.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="../Content/fontawesome/css/all.min.css">

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--header-height) + 40px) 20px 60px;
      background: linear-gradient(135deg, rgba(14,165,233,0.05) 0%, rgba(20,184,166,0.05) 100%);
    }

    .auth-card {
      background: var(--bg-primary);
      border-radius: var(--radius-2xl);
      padding: 40px;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--gray-200);
      width: 100%;
      max-width: 460px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--gray-200);
      background: var(--bg-primary);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .social-btn:hover { background: var(--gray-100); }
  </style>
</head>
<body data-page="register">

  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <main class="auth-container">
    <div class="auth-card anim-scale">
      <div class="text-center mb-24">
        <h2 style="font-size:24px; font-weight:800;">Create Account</h2>
        <p style="font-size:14px; color:var(--text-secondary);">Join 50,000+ travellers exploring Incredible India</p>
      </div>

      <form id="register-form-page" onsubmit="event.preventDefault(); Toast.show('Account created successfully! Welcome aboard ✈️', 'success'); setTimeout(() => window.location.href='index.html#page-dashboard', 1500);">
        <div class="form-group">
          <label class="form-label" for="page-reg-name">Full Name</label>
          <input type="text" id="page-reg-name" class="form-control" placeholder="e.g. Vikram Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="page-reg-email">Email Address</label>
          <input type="email" id="page-reg-email" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="page-reg-pass">Create Password</label>
          <input type="password" id="page-reg-pass" class="form-control" placeholder="Min 8 characters" required>
        </div>

        <button type="submit" class="btn btn-accent btn-lg" style="width:100%;">Create Account 🎉</button>

        <div class="divider" style="text-align:center; position:relative; margin:24px 0;">
          <span style="background:var(--bg-primary); padding:0 12px; color:var(--text-muted); font-size:12px;">OR SIGN UP WITH</span>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px;">
          <button type="button" class="social-btn" onclick="Toast.show('Google Sign-Up initialized', 'info')">
            <i class="fa-brands fa-google" style="color:#EA4335;"></i> Sign up with Google
          </button>
        </div>
      </form>

      <div class="text-center mt-24" style="font-size:14px; color:var(--text-secondary);">
        Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600;">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- JS -->
  <script src="../Scripts/js/components.js"></script>
  <script src="../Scripts/js/main.js"></script>
</body>
</html>
